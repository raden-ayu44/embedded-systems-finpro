<svg xmlns="http://www.w3.org/2000/svg" width="1170" viewBox="0 0 780 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cradle (nampan) untuk beban kalibrasi di atas batang B</title>
<desc>Rakitan dibalik: batang A di bawah dijepit ke meja, batang B di atas. Di atas bidang tumpu B duduk balok PLA dengan lidah di antara dua ridge dan dua skirt di sisi B. Di atas balok ada papan yang memegang dumbbell.</desc>
