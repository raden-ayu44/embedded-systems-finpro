<text x="390" y="430" text-anchor="middle" font-size="10" fill="#6b675f">Tidak berskala; dua tampak memakai skala berbeda. Rakitan dibalik: A di bawah dijepit ke meja, beban menekan B ke arah A (arah remasan).</text>
<text x="390" y="444" text-anchor="middle" font-size="10" fill="#6b675f">Lidah tinggi = ridge_h + 1 mm (balok tidak menyentuh puncak ridge). Skirt turun sampai 8 mm di bawah permukaan atas B.</text>
<text x="390" y="458" text-anchor="middle" font-size="10" fill="#6b675f">Usulan, belum diuji; ukuran mengikuti model Fusion.</text>
