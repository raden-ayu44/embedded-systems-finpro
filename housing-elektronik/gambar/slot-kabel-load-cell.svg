<text x="50" y="466" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">1</text>
<text x="68" y="466" font-size="13" fill="#333">Lid dibalik (sisi terbuka di atas); PCB sudah di dalam lid.</text>
<circle cx="50" cy="490" r="10" fill="#E39B2D"/>
<text x="50" y="494" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">2</text>
<text x="68" y="494" font-size="13" fill="#333">Kabel hitam diletakkan ke slot dari sisi terbuka, lalu HX711 ditancapkan ke J1.</text>
<circle cx="50" cy="518" r="10" fill="#E39B2D"/>
<text x="50" y="522" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">3</text>
<text x="68" y="522" font-size="13" fill="#333">Body dipasang: lidah masuk ke slot dan menjepit kabel 0,3 mm; snap terkunci.</text>
<circle cx="50" cy="546" r="10" fill="#E39B2D"/>
<text x="50" y="550" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">4</text>
<text x="68" y="550" font-size="13" fill="#333">Bongkar: lepas body, kabel lepas dari slot; tidak ada lem.</text>
<text x="40" y="590" font-size="15" font-weight="600" fill="#222">Parameter (usulan, untuk CSV housing elektronik)</text>
<text x="40" y="614" font-size="12.5" font-family="Consolas, monospace" fill="#1f5fa8">cable_d</text>
<text x="132" y="614" font-size="12.5" font-family="Consolas, monospace" fill="#222">4 mm</text>
<text x="132" y="614" font-size="12.5" fill="#222"></text>
<text x="410" y="614" font-size="12" fill="#555">diameter kabel (asumsi.md, 11 Okt.)</text>
<text x="40" y="635" font-size="12.5" font-family="Consolas, monospace" fill="#1f5fa8">cable_zc</text>
<text x="132" y="635" font-size="12.5" font-family="Consolas, monospace" fill="#222">7 mm</text>
<text x="132" y="635" font-size="12.5" fill="#222"></text>
<text x="410" y="635" font-size="12" fill="#555">pusat kabel di atas sambungan (z -15)</text>
<text x="40" y="656" font-size="12.5" font-family="Consolas, monospace" fill="#1f5fa8">cslot_w</text>
<text x="132" y="656" font-size="12.5" font-family="Consolas, monospace" fill="#222">cable_d + comp_xy = 4,6</text>
<text x="132" y="656" font-size="12.5" fill="#222"></text>
<text x="410" y="656" font-size="12" fill="#555">tercetak ≈ 4,0 (pas kabel)</text>
<text x="40" y="677" font-size="12.5" font-family="Consolas, monospace" fill="#1f5fa8">cslot_h</text>
<text x="132" y="677" font-size="12.5" font-family="Consolas, monospace" fill="#222">cable_zc + cable_d/2 + comp_z/2 = 9,5</text>
<text x="132" y="677" font-size="12.5" fill="#222"></text>
<text x="410" y="677" font-size="12" fill="#555">hanya tepi atas tercetak: ½ comp_z</text>
<text x="40" y="698" font-size="12.5" font-family="Consolas, monospace" fill="#1f5fa8">ctongue_w</text>
<text x="132" y="698" font-size="12.5" font-family="Consolas, monospace" fill="#222">cable_d − 2·lip_cl = 3,5</text>
<text x="132" y="698" font-size="12.5" fill="#222"></text>
<text x="410" y="698" font-size="12" fill="#555">celah 0,25 per sisi ke slot tercetak</text>
<text x="40" y="719" font-size="12.5" font-family="Consolas, monospace" fill="#1f5fa8">ctongue_h</text>
<text x="132" y="719" font-size="12.5" font-family="Consolas, monospace" fill="#222">cable_zc − cable_d/2 + squeeze = 5,3</text>
<text x="132" y="719" font-size="12.5" fill="#222"></text>
<text x="410" y="719" font-size="12" fill="#555">squeeze 0,3: angka awal, sesuaikan setelah cetak</text>
<text x="40" y="754" font-size="15" font-weight="600" fill="#222">Dibanding pintu geser dovetail</text>
<text x="40" y="776" font-size="13" fill="#333">✓ Kerja Fusion: 1 extrude-cut di lid + 1 extrude di body (pintu: rel, muka miring, pintu, ruang geser 18 mm).</text>
<text x="40" y="796" font-size="13" fill="#333">✓ Tanpa uji pas dovetail di PLA; comp_xy dan comp_z sudah terukur.</text>
<text x="40" y="816" font-size="13" fill="#333">✓ Menahan tarikan kabel (pintu Ø6 longgar ±1 mm per sisi, tidak menjepit).</text>
<text x="40" y="836" font-size="13" fill="#333">✓ Bisa dibongkar lagi bila sambungan solder atau kabel hitam bermasalah.</text>
</svg>