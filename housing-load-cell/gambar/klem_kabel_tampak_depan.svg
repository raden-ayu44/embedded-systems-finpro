<text class="lbl" x="505.0" y="436.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2328" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">Spacer A</text>
<line x1="30.0" y1="920.0" x2="1070.0" y2="920.0" stroke="#9aa1aa" stroke-width="0.8" />
<text class="lbl" x="30.0" y="950.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">(1) Blok penjepit PLA 8,2 × 8 × 17,4, satu cetakan dengan rak Spacer A (rak 16 × 2,5, menjulur 10).</text>
<text class="lbl" x="30.0" y="970.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">(2) Lubang Ø4,1 menembus blok; kabel Ø4 dilem tembak lurus, tanpa lem ke aluminium.</text>
<text class="lbl" x="30.0" y="990.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">(3) Kabel menekuk bebas ke arah B (R10, asumsi), hanya arah rute.</text>
<text class="lbl" x="30.0" y="1010.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">(4) Garis putus = lubang Ø5 load cell di balik blok.</text>
<text class="lbl" x="30.0" y="1030.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Dinding samping lubang = (8,2 − 4,1) / 2 = 2,05. Jarak bebas blok ke pelat B = 26,5 − 17,4 ≈ 9,1.</text>
<text class="lbl" x="30.0" y="1050.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Warna: abu-abu = pelat aluminium dan load cell; oranye = PLA (Spacer A, rak, blok); gelap = kabel. Sumber protokol: V1.</text>
