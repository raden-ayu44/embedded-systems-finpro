<line x1="30.0" y1="920.0" x2="1070.0" y2="920.0" stroke="#9aa1aa" stroke-width="0.8" />
<text class="lbl" x="30.0" y="950.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Bidang potong A-A di sumbu lubang (x = 4,2) diarsir: pelat A dan B, load cell, Spacer A + rak + blok (satu cetakan PLA).</text>
<text class="lbl" x="30.0" y="970.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Blok terpotong dua oleh lubang Ø4,1: z 0 sampai 11,2 (sisi A) dan z 15,3 sampai 17,4 (sisi B).</text>
<text class="lbl" x="30.0" y="990.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Celah blok ke load cell 1. Dinding lubang: 2,1 ke arah B dan 11,2 ke arah A (diukur dari muka pelat A, termasuk rak 2,5).</text>
<text class="lbl" x="30.0" y="1010.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Celah kabel Ø4 ke lubang Ø5 = (5 − 4) / 2 = 0,5 per sisi. Kabel dilem tembak lurus di lubang blok, tanpa lem ke aluminium.</text>
<text class="lbl" x="30.0" y="1030.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Setelah blok kabel menekuk bebas ke arah B, R10 (asumsi), pusat busur di d = 9, z = 23,25; hanya arah rute.</text>
<text class="lbl" x="30.0" y="1050.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328">Arah pandang: dari ujung tetap ke arah +x. A di atas, B di bawah. Sumber protokol: V1.</text>
</svg>