<text x="52.0" y="560.0" fill="#a04000" text-anchor="start" font-size="13">Slot alas kalibrasi di CSV (oranye titik-titik, 29 x 14) lebih kecil dari dua flange: 15 + 14,2 = 29,2 panjang, 14,2 lebar.</text>
<text x="52.0" y="580.0" fill="#a04000" text-anchor="start" font-size="13">Perbesar slot sesudah kepala baut diukur, misalnya 32 x 17. Dua flange A berjarak 0,8 mm satu sama lain (15 - 14,2), tidak bersentuhan.</text>
<text x="52.0" y="600.0" fill="#a04000" text-anchor="start" font-size="13">Tepi flange 3,4 mm di luar zona genggam di kedua ujung. Spacer 34 (0,5 di dalam tepi pelat 35); hanya bantalan klem yang menonjol. Ridge belum digambar.</text>
