<text x="10.00" y="20.00" class="s" text-anchor="start">Skala 1:1, ukuran dalam mm. Dihasilkan dari CSV parameter housing grip (generate_drawings.py). Cetak 100 % (ukuran sebenarnya), lalu cek skala di kanan bawah.</text>
