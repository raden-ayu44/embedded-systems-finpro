<text x="182.00" y="34.00" class="b" text-anchor="start">CATATAN</text>
<text x="182.00" y="39.20" class="n" text-anchor="start">Bahan: aluminium 6061-T6, 140 × 40 × 8 mm</text>
<text x="182.00" y="44.40" class="n" text-anchor="start">Jumlah: 2 pelat, keduanya sama persis.</text>
<text x="182.00" y="49.60" class="n" text-anchor="start">Lubang HANYA di satu ujung tiap pelat.</text>
<text x="182.00" y="54.80" class="n" text-anchor="start">Saat dirakit, pelat kedua dibalik ujung ke</text>
<text x="182.00" y="60.00" class="n" text-anchor="start">ujung, jadi lubangnya di ujung seberang.</text>
<text x="182.00" y="65.20" class="n" text-anchor="start">Bor Ø6,6 tembus, tegak lurus muka pelat.</text>
<text x="182.00" y="70.40" class="n" text-anchor="start">Toleransi pusat lubang ±0,2 (terutama jarak</text>
<text x="182.00" y="75.60" class="n" text-anchor="start">15 antar lubang dan 17 dari ujung).</text>
<text x="182.00" y="80.80" class="n" text-anchor="start">Hilangkan bram (deburr) di kedua sisi.</text>
<text x="182.00" y="86.00" class="n" text-anchor="start">Tanpa ulir, tanpa countersink.</text>
<text x="182.00" y="91.20" class="n" text-anchor="start">Ukuran lain ±0,5 (dipotong penjual).</text>
<text x="182.00" y="96.40" class="s" text-anchor="start"></text>
<text x="182.00" y="101.60" class="b" text-anchor="start">MENANDAI LUBANG</text>
<text x="182.00" y="106.80" class="n" text-anchor="start">Cetak lembar ini 100 %; ukur skala 100 mm.</text>
<text x="182.00" y="112.00" class="n" text-anchor="start">Tempel pada pelat, sejajarkan ujung kiri dan</text>
<text x="182.00" y="117.20" class="n" text-anchor="start">tepi atas; center punch di tanda silang.</text>
<text x="182.00" y="122.40" class="n" text-anchor="start">Bor pilot kecil dulu, lalu Ø6,6.</text>
