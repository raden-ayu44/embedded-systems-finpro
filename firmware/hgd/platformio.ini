; Proyek PlatformIO firmware utama HGD (hand grip dynamometer), embedded system.
;
; Catatan build:
; - PlatformIO dipakai selama pengembangan (Arduino core 2.0.17 bawaan platform espressif32).
; - Build akhir dan flash untuk demo memakai Arduino IDE dengan core 3.3.11, membuka folder hgd/
;   sebagai sketsa. Karena itu kode hanya memakai API yang sama di core 2 dan core 3.
; - src_dir = hgd: folder sketsa Arduino dipakai langsung sebagai sumber PlatformIO,
;   jadi satu folder bisa dikompilasi di kedua alat.

[platformio]
src_dir = hgd

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Versi library sama dengan yang terpasang di Arduino IDE.
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
